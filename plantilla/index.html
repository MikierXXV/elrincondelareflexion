<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{documento.titulo}}</title>
  <meta name="description" content="{{documento.descripcion}}">
  {{alternativas}}

  <!--
    Icono en línea, como dato y no como fichero.

    Sin ninguna declaración el navegador pide `/favicon.ico` por su cuenta y se lleva un 404 en cada
    carga: un error en la consola que no significa nada y que tapa los que sí. Un `.ico` en `public/`
    lo arreglaría igual, pero sería una petición más en el arranque para dieciséis por dieciséis
    píxeles, y este proyecto mide lo que descarga antes de ser usable.

    El dibujo es la letra de la marca sobre el papel del sitio. En SVG hereda el color que se le pone
    aquí, así que no hay que mantener dos versiones para tema claro y oscuro: el navegador lo pinta
    igual en los dos y se lee en ambos, que es más de lo que consigue un icono monocromo.
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231A1917'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='600' text-anchor='middle' fill='%23F5F3EE'%3ER%3C/text%3E%3C/svg%3E">

  <!--
    ANTES DEL PRIMER PINTADO. Tiene que ser un script en línea y en la cabecera: cualquier otra cosa
    llega tarde.

    El tema elegido se guarda en el navegador, pero aplicarlo desde el módulo principal significa
    aplicarlo cuando ese módulo ha cargado. Medido: a los 47 ms la página estaba en blanco y el tema
    oscuro no entraba hasta los 186 ms, así que quien había elegido oscuro veía un fogonazo blanco en
    cada recarga. Aquí se resuelve antes de que se pinte un solo píxel.

    Sin `defer` ni `type=module` a propósito: los dos difieren la ejecución, que es justo lo contrario
    de lo que hace falta.
  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('rincon:tema');
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
      } catch (e) { /* almacenamiento bloqueado: manda la preferencia del sistema */ }

      /*
       * El navegador no restaura el desplazamiento en píxeles. De volver donde estabas se encarga
       * `posicion.ts`, que guarda un ANCLA y no una altura, porque la página carga las ideas por
       * proximidad y su altura cambia mientras se lee.
       *
       * Estaba declarado en `main.ts` y ahí llega tarde, por el mismo motivo que el tema: los módulos
       * se difieren y el navegador ya ha decidido. El efecto es un salto intermedio —una franja en
       * blanco, o el pie— entre lo que restaura el navegador y lo que reancla el sitio. Aquí, en
       * línea y sin diferir, no llega a haber nada que restaurar.
       *
       * Los enlaces con ancla siguen funcionando: esto solo afecta a la restauración automática.
       */
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    })();
  </script>

  <!-- Fondo y color de texto en línea, generados desde design/tokens.css. Van justo después del
       script del tema para que el primer pintado ya sea correcto aunque la hoja de estilos no haya
       llegado. Ver el porqué en scripts/generar-html.mjs. -->
  {{critico}}

  <!-- La hoja completa, como enlace y no importada desde el módulo: así es bloqueante también en el
       servidor de desarrollo. Ver el porqué en src/main.ts. -->
  <link rel="stylesheet" href="{{estilos}}">
</head>
<body>
  <!-- `data-t` nombra la clave de ui.json con la que se generó cada cadena. El generador la escribe
       y, al cambiar de idioma sin recargar, una única función recorre estos nodos y los reescribe
       desde el mismo sitio. Generador y ejecución no pueden discrepar porque leen la misma clave. -->
  <a class="saltar-a-contenido" href="#recorrido" data-t="barra.saltar_a_contenido">{{barra.saltar_a_contenido}}</a>

  <header class="barra">
    <span class="marca">El Rincón de la Reflexión</span>
    <nav class="ajustes">
      <!-- Control segmentado: se ven los dos idiomas y se marca el actual, para que no haya que
           adivinar si «EN» significa «estás en inglés» o «ve a inglés». El destino es un enlace de
           verdad —tiene dirección propia— así que se puede abrir en otra pestaña y compartir. -->
      <div class="idiomas">
        <span class="actual" aria-current="true">{{lang_corto}}</span>
        <a id="idioma" href="{{enlace.otro}}" hreflang="{{otro}}" aria-label="{{barra.idioma}}">{{otro_corto}}</a>
      </div>
      <button id="tema" type="button" aria-label="{{barra.tema_a_oscuro}}">
        <!-- Los dos iconos van en el marcado y CSS enseña el que toca: así el botón muestra el tema
             al que se va incluso antes de que JavaScript haya arrancado. -->
        <svg class="a-oscuro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>
        <svg class="a-claro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4"/>
        </svg>
      </button>
    </nav>
  </header>

  <main>
    <section id="hero">
      <div class="texto">
        <h1 data-t="hero.titular">{{hero.titular}}</h1>
        <p id="cifras" class="cifras"></p>
        <p class="entradilla" data-t="hero.entradilla">{{hero.entradilla}}</p>
        <nav class="entradas">
          <a class="principal" href="#corriente-presocraticos" data-t="hero.entrar">{{hero.entrar}}</a>
          <a href="#/cromos" data-t="hero.cromos">{{hero.cromos}}</a>
        </nav>
      </div>
      <!-- La silueta viene en el documento y ocupa el hueco desde el primer pintado, así que ni hay
           salto de maqueta ni un cuadro en blanco mientras llega la malla. Se funde al montarse la
           escena, y si no hay WebGL o se ha pedido reducir el movimiento, se queda. -->
      <div id="pensador" aria-hidden="true">{{silueta}}</div>
      <p class="desliza chevron" aria-hidden="true"></p>
    </section>

    <div id="recorrido"></div>
    <div id="final"></div>
  </main>

  <nav id="widget"></nav>

  <!-- Una sola línea, tenue. Los créditos —que incluyen la atribución CC BY del escaneo— viven en
       su propia capa: al final de un recorrido de lectura, cuatro líneas de atribuciones compiten
       con lo último que se acaba de leer. -->
  <footer>
    <p>
      <span data-t="pie.copyright">{{pie.copyright}}</span>
      <a href="#/creditos" data-t="pie.creditos">{{pie.creditos}}</a>
    </p>
  </footer>

  <script type="module" src="{{entrada}}"></script>
</body>
</html>
